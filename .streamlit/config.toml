[theme]
# نارنجی جیغ برای دکمه‌ها، چک‌باکس‌ها و المان‌های اصلی
primaryColor = "#FF4500"

# طوسی خیلی روشن برای بک‌گراند کل صفحه
backgroundColor = "#F3F4F6"

# طوسی یه کم تیره‌تر برای سایدبار و باکس‌ها
secondaryBackgroundColor = "#E5E7EB"

# رنگ متن تیره (سرمه‌ای تیره) برای خوانایی کامل روی پس‌زمینه طوسی
textColor = "#0F172A"

# فونت مدرن و ساده
font = "sans serif"